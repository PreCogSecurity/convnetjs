# Keeps the dependency tree current without a human having to remember.
# convnetjs has no runtime dependencies, so these are limited to the dev
# toolchain (test runner, linter, coverage) plus the GitHub Actions used by CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # eslint 9 and jasmine 6 are major upgrades; let Dependabot open them but
    # never let it merge or rebase on its own.
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps)'
    labels:
      - dependencies
      - ci
